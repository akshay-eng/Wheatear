[project]
name = "wheatear"
version = "0.1.0"
description = "Migrate AI agents and workflows between orchestration platforms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "questionary>=2.0",
    "rich>=13.0",
    "pyfiglet>=1.0",
    "rich-pixels>=3.0",
    "pillow>=10.0",
    "keyring>=24.0",
    "requests>=2.28",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.12",
    # The web console's Copilot Studio corridor starts a Microsoft device-code
    # sign-in, so MSAL is required at runtime rather than an optional add-on.
    "msal>=1.31,<2",
    # Every supported corridor targets watsonx Orchestrate: the ADK is what
    # imports agents, reads the tenant's model list, and creates connections.
    # It was installed by hand here and not declared, so a fresh `pip install`
    # produced an environment that passed its tests and could not migrate.
    "ibm-watsonx-orchestrate>=2.13",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
google = ["google-genai>=1.0"]
openai = ["openai>=1.50"]
watsonx = ["ibm-watsonx-ai>=1.1"]
copilot-studio = []
dev = ["pytest>=8.0", "vcrpy>=6.0", "httpx>=0.27"]

[project.scripts]
wheatear = "wheatear.cli:main"
wheatear-web = "wheatear.service.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wheatear*"]

[tool.setuptools.package-data]
wheatear = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
